name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main # Change this to your default branch if needed

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt || echo "No requirements.txt found, skipping"

      - name: Generate pre-built documentation (optional)
        run: |
          mkdir -p frontend/prebuilt
          # If we have any pre-built documentation, generate it here
          # python backend/scripts/generate_prebuilt_docs.py || echo "No prebuilt docs script found, skipping"

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: frontend # The folder containing the static website files
          branch: gh-pages # The branch to deploy to
